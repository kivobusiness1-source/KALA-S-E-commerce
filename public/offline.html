<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Hors ligne — KALA'S</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #ffffff;
      color: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card { max-width: 420px; width: 100%; }
    .drop {
      width: 72px; height: 72px; margin: 0 auto 20px;
      border-radius: 50% 50% 50% 6px;
      transform: rotate(45deg);
      background: linear-gradient(135deg, #34d399 0%, #059669 60%, #1e3a5f 100%);
      box-shadow: 0 8px 24px rgba(5, 150, 105, 0.25);
    }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 10px; color: #1a1a1a; }
    p { font-size: 14px; line-height: 1.6; color: #555555; margin-bottom: 24px; }
    button {
      display: inline-block;
      padding: 12px 28px;
      border: none;
      border-radius: 10px;
      background: #059669;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #047857; }
    .phone { margin-top: 18px; font-size: 13px; color: #888888; }
    .phone a { color: #059669; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <div class="drop" aria-hidden="true"></div>
    <h1>Vous êtes hors ligne</h1>
    <p>
      Impossible de charger cette page. Vérifiez votre connexion internet,
      puis réessayez.
    </p>
    <button onclick="window.location.reload()">Réessayer</button>
    <p class="phone">
      Besoin d'aide ? Appelez le <a href="tel:+242061234567">+242 06 123 4567</a>
    </p>
  </div>
</body>
</html>
